<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Unpack Your Learning</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2eee7;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 18px;
      margin-top: 5px;
    }

    model-viewer {
      width: 100%;
      height: 430px;
      background: #ffffff;
      border-radius: 16px;
      margin-top: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.18);
    }

    .instructions {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-top: 20px;
      line-height: 1.5;
    }

    .test {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📦 Unpack Your Learning</h1>

  <p class="subtitle">
    Handle With Experience
  </p>

<model-viewer
    src="models/unpack-box.glb"
    ios-src="models/unpack-box.usdz"
    alt="Unpack Your Learning packing box"
    camera-controls
    autoplay
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    ar
    ar-modes="webxr scene-viewer quick-look">

    <button
      slot="ar-button"
      style="
        background: #222;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 14px 22px;
        font-size: 18px;
        font-weight: bold;
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
      ">
      📦 VIEW IN YOUR SPACE
    </button>

  </model-viewer>

  <div class="instructions">

    <strong>3D MODEL TEST</strong>

    <p>
      Drag the box with your finger to rotate it.
    </p>

    <p>
      Pinch to zoom in and out.
    </p>

    <div class="test">
      If you can see and rotate the packing box,
      Test 2 is successful.
    </div>

  </div>

</div>

</body>
</html>
